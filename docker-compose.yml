services:
  php:
    build:
      context: .
      target: ${BUILD_TARGET:-production}
    ports:
      - '127.0.0.1:8000:80'
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - runtime:/app/runtime
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  runtime:
  redis-data:
